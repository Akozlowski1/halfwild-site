# Builds the site with Python and publishes it to GitHub Pages on every push to main.
# Only used if GitHub Pages is chosen as the host. Cloudflare Pages instead uses:
#   build command: python3 tools/build.py   output directory: dist
name: Publish site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 tools/build.py
        env:
          # Staging address is a sub-folder. Remove this line at cutover, when the CNAME file is added.
          HW_BASE: /halfwild-site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
